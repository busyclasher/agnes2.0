services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AGNES_MODE: ${AGNES_MODE:-live}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-}
      AGNES_MODEL: ${AGNES_MODEL:-agnes-2.0-flash}
      AGNES_IMAGE_MODEL: ${AGNES_IMAGE_MODEL:-agnes-image-2.1-flash}
      AGNES_IMAGE_SIZE: ${AGNES_IMAGE_SIZE:-1024x1024}
      AGNES_TIMEOUT_SECONDS: ${AGNES_TIMEOUT_SECONDS:-30}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-JBFqnCBsd6RMkjVDRZzb}
      ELEVENLABS_BENGALI_VOICE_ID: ${ELEVENLABS_BENGALI_VOICE_ID:-}
      ELEVENLABS_TAMIL_VOICE_ID: ${ELEVENLABS_TAMIL_VOICE_ID:-}
      ELEVENLABS_HINDI_VOICE_ID: ${ELEVENLABS_HINDI_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_v3}
      ELEVENLABS_TTS_MODEL_ID: ${ELEVENLABS_TTS_MODEL_ID:-eleven_v3}
      ELEVENLABS_STT_MODEL_ID: ${ELEVENLABS_STT_MODEL_ID:-scribe_v2}
      ELEVENLABS_TIMEOUT_SECONDS: ${ELEVENLABS_TIMEOUT_SECONDS:-20}
      USE_SAMPLE_FALLBACK: ${USE_SAMPLE_FALLBACK:-true}
      STORE_SCANNED_IMAGES_BY_DEFAULT: ${STORE_SCANNED_IMAGES_BY_DEFAULT:-false}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
